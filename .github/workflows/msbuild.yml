name: MSBuild

on: [push]


# Needed for release job
permissions:
  contents: write

# on:
#   push:
#     branches: 
#      - 'master'

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  # Only Release tested!
  BUILD_CONFIGURATION: Release
  BUILD_SHARED: ON
  SHARED_DEFINITIONS: ANVIL_DISABLED
  RC_SHADERS: 1
  OUT_DIR: dist
  GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  FEANOR_ANVIL_ID: 13937410
  FEANOR_CORE_ID: 11660029
  FEANOR_EXTERNAL_ID: 13987704
  NRI_TAG: v1.100
  NRD_TAG: v4.3.5
  
jobs:
  build-feanor-core:
    runs-on: windows-2022
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
    - name: Build Feanor Core
      id: build
      uses: ./.github/actions/build-feanor
      with:
        component: 'core'
        repo_id: ${{ env.FEANOR_CORE_ID }}
        install_path: installed-core
        
  build-feanor-external:
    runs-on: windows-2022
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
    - name: Build Feanor External
      id: build
      uses: ./.github/actions/build-feanor
      with:
        component: 'external'
        repo_id: ${{ env.FEANOR_EXTERNAL_ID }}
        install_path: installed-external
        submodules: true

  build-feanor-anvil:
    runs-on: windows-2022
    needs: [build-feanor-core, build-feanor-external]
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
    # Get cache contents
    - name: Cache Feanor Core
      id: cache-core
      uses: actions/cache@v4
      with:
        path: installed-core
        key: feanor-core-${{ needs.build-feanor-core.outputs.sha }}

    - name: Cache Feanor External
      id: cache-external
      uses: actions/cache@v4
      with:
        path: installed-external
        key: feanor-external-${{ needs.build-feanor-external.outputs.sha }}

    # Validate all caches present
    - name: Validate all caches present
      if: steps.cache-core.outputs.cache-hit != 'true' || steps.cache-external.outputs.cache-hit != 'true'
      run: |
        echo "Validation failed. There is a missing cache"
        exit 1
    
    # Merge dirs
    - name: Merge dependency directories into installed directory
      run: |
        New-Item installed -ItemType Directory
        Copy-Item -Path installed-core\* -Destination installed -Recurse -Force
        Copy-Item -Path installed-external\* -Destination installed -Recurse -Force
      
    - name: Build Feanor Anvil
      id: build
      uses: ./.github/actions/build-feanor
      with:
        component: 'anvil'
        repo_id: ${{ env.FEANOR_ANVIL_ID }}
        prefix_path: installed
        append_key: '-${{ needs.build-feanor-core.outputs.sha }}-${{ needs.build-feanor-external.outputs.sha }}'
        install_path: installed-anvil
        
  build-nvidia-nri:
    runs-on: windows-2022
    outputs:
      sha: ${{ steps.nri-sha.outputs.sha }}
    steps:
    - name: Get NVIDIA NRI details
      run: |
        curl --location --output nri.sha "https://api.github.com/repos/NVIDIAGameWorks/NRI/commits/${{env.NRI_TAG}}"
    
    - name: Read NVIDIA NRI Json from file
      id: read-nri-json
      uses: juliangruber/read-file-action@v1.1.7
      with:
        path: nri.sha
        
    - name: Set output NVIDIA NRI SHA
      id: nri-sha
      run: echo "sha=${{ fromJson(steps.read-nri-json.outputs.content).sha }}" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf-8 -Append
    
    - name: Cache NVIDIA NRI
      id: cache-nri
      uses: actions/cache@v4
      with:
        path: NRI\_NRI_SDK
        key: nvidia-nri-${{ steps.nri-sha.outputs.sha }}
    
    # Static lib is broken - Add "-DNRI_STATIC_LIBRARY:BOOL=ON" to try again
    - name: Get NVIDIA NRI
      if: steps.cache-nri.outputs.cache-hit != 'true'
      run: |
        git clone --branch ${{env.NRI_TAG}} https://github.com/NVIDIAGameWorks/NRI
        cd NRI
        git checkout ${{ steps.nri-sha.outputs.sha }}
        git submodule update --init --recursive
        cmake -B _Compiler
        cmake --build _Compiler --parallel --config Release
        & ".\3-Prepare NRI SDK.bat"
        cd ..
        
  build-nvidia-nrd:
    runs-on: windows-2022
    outputs:
      sha: ${{ steps.nrd-sha.outputs.sha }}
    steps:
    - name: Get NVIDIA NRD details
      run: |
        curl --location --output nrd.sha "https://api.github.com/repos/NVIDIAGameWorks/RayTracingDenoiser/commits/${{env.NRD_TAG}}"

    - name: Read NVIDIA NRD Json from file
      id: read-nrd-json
      uses: juliangruber/read-file-action@v1.1.7
      with:
        path: nrd.sha

    - name: Set output NVIDIA NRD SHA
      id: nrd-sha
      run: echo "sha=${{ fromJson(steps.read-nrd-json.outputs.content).sha }}" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf-8 -Append
    
    - name: Cache NVIDIA NRD
      id: cache-nrd
      uses: actions/cache@v4
      with:
        path: RayTracingDenoiser\_NRD_SDK
        key: nvidia-nrd-${{ steps.nrd-sha.outputs.sha }}

    - name: Get Microsoft DXC Json
      if: steps.cache-nrd.outputs.cache-hit != 'true'
      run: curl --location --output microsoft.dxc "https://api.github.com/repos/microsoft/DirectXShaderCompiler/releases/latest"

    - name: Read Microsoft DXC Json from file
      if: steps.cache-nrd.outputs.cache-hit != 'true'
      id: read-dxc-json
      uses: juliangruber/read-file-action@v1.1.7
      with:
        path: microsoft.dxc

    - name: Get Microsoft DXC Zip Asset
      if: steps.cache-nrd.outputs.cache-hit != 'true'
      run: curl --location --output msdxc.zip "${{ fromJson(steps.read-dxc-json.outputs.content).assets[0].browser_download_url }}"

    - name: Extract Microsoft DXC Zip Asset
      if: steps.cache-nrd.outputs.cache-hit != 'true'
      run: 7z x msdxc.zip -odxc

    # For static add -DNRD_STATIC_LIBRARY:BOOL=ON 
    - name: Get NVIDIA NRD
      if: steps.cache-nrd.outputs.cache-hit != 'true'
      run: |
        git clone --branch ${{env.NRD_TAG}} https://github.com/NVIDIAGameWorks/RayTracingDenoiser
        cd RayTracingDenoiser
        git checkout ${{ steps.nrd-sha.outputs.sha }}
        git submodule update --init --recursive
        cmake -B _Compiler -DNRD_INTERPROCEDURAL_OPTIMIZATION:BOOL=ON -DDXC_SPIRV_PATH:FILEPATH="${{github.workspace}}\dxc\bin\x64\dxc.exe" -DCMAKE_SYSTEM_VERSION="10.0.22621.0"
        cmake --build _Compiler --parallel --config Release
        & ".\3-Prepare NRD SDK.bat" --no-pause --no-shaders --integration
        cd ..
  
  build:
    runs-on: windows-2022
    needs: [build-feanor-core, build-feanor-external, build-feanor-anvil, build-nvidia-nri, build-nvidia-nrd]
    steps:
    - uses: actions/checkout@v4
    
    # Get cache contents
    - name: Cache Feanor Core
      id: cache-core
      uses: actions/cache@v4
      with:
        path: installed-core
        key: feanor-core-${{ needs.build-feanor-core.outputs.sha }}

    - name: Cache Feanor External
      id: cache-external
      uses: actions/cache@v4
      with:
        path: installed-external
        key: feanor-external-${{ needs.build-feanor-external.outputs.sha }}

    - name: Cache Feanor Anvil
      id: cache-anvil
      uses: actions/cache@v4
      with:
        path: installed-anvil
        key: feanor-anvil-${{ needs.build-feanor-anvil.outputs.sha }}-${{ needs.build-feanor-core.outputs.sha }}-${{ needs.build-feanor-external.outputs.sha }}

    - name: Cache NVIDIA NRI
      id: cache-nri
      uses: actions/cache@v4
      with:
        path: NRI\_NRI_SDK
        key: nvidia-nri-${{ needs.build-nvidia-nri.outputs.sha }}

    - name: Cache NVIDIA NRD
      id: cache-nrd
      uses: actions/cache@v4
      with:
        path: RayTracingDenoiser\_NRD_SDK
        key: nvidia-nrd-${{ needs.build-nvidia-nrd.outputs.sha }}
    
    # Validate all caches present
    - name: Validate all caches present
      if: steps.cache-core.outputs.cache-hit != 'true' || steps.cache-external.outputs.cache-hit != 'true' || steps.cache-anvil.outputs.cache-hit != 'true' || steps.cache-nri.outputs.cache-hit != 'true' || steps.cache-nrd.outputs.cache-hit != 'true'
      run: |
        echo "Validation failed. There is a missing cache"
        exit 1
    
    # Merge dirs
    - name: Merge dependency directories into installed directory
      run: |
        New-Item installed -ItemType Directory
        Copy-Item -Path installed-core\* -Destination installed -Recurse -Force
        Copy-Item -Path installed-external\* -Destination installed -Recurse -Force
        Copy-Item -Path installed-anvil\* -Destination installed -Recurse -Force
    
    - name: Add FEANOR_ROOT Environment Variable
      run: echo "FEANOR_ROOT=${{github.workspace}}\installed" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append

    - name: Add NRI_ROOT Environment Variable
      run: echo "NRI_ROOT=${{github.workspace}}\NRI\_NRI_SDK" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append

    - name: Add NRD_ROOT Environment Variable
      run: echo "NRD_ROOT=${{github.workspace}}\RayTracingDenoiser\_NRD_SDK" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
      
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{github.workspace}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:ForceImportBeforeCppTargets=${{github.workspace}}\MyProps.props /p:SharedDefinitions=${{env.SHARED_DEFINITIONS}} /p:RCShaders=${{env.RC_SHADERS}} /p:OutDir=${{github.workspace}}\${{env.OUT_DIR}}\ ${{env.SOLUTION_FILE_PATH}}
      
    - name: Remove Shaders Directory if RC_SHADERS is 1
      if: env.RC_SHADERS == '1'
      run: |
        Remove-Item -Recurse -Force "${{github.workspace}}\${{env.OUT_DIR}}\Shaders"
        Write-Host "Shaders directory removed."

    - name: Copy Feanor Core and External DLLs
      if: env.BUILD_SHARED == 'ON'
      run: |
        Copy-Item ".\installed\bin\Core.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"
        Copy-Item ".\installed\bin\assimp-vc143-mt.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"
        Copy-Item ".\installed\bin\imgui.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"
        Copy-Item ".\installed\bin\stb.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"
        Copy-Item ".\installed\bin\tinyexr.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"
        Copy-Item ".\installed\bin\tinyobjloader.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"

    - name: Copy Anvil DLLs if needed
      if: env.BUILD_SHARED == 'ON' && !contains(env.SHARED_DEFINITIONS, 'ANVIL_DISABLED')
      run: |
        Copy-Item ".\installed\bin\Anvil.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"
        Copy-Item ".\installed\bin\zlib1.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"
        Copy-Item ".\installed\bin\glew32.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"
        Copy-Item ".\installed\bin\glfw3.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"

    - name: Copy NRI and NRD DLL
      run: |
        Copy-Item ".\NRI\_NRI_SDK\Lib\Release\NRI.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"
        Copy-Item ".\RayTracingDenoiser\_NRD_SDK\Lib\Release\NRD.dll" -Destination "${{github.workspace}}\${{env.OUT_DIR}}\"

    - uses: actions/upload-artifact@v4
      with:
        name: CandelaDXR
        path: ${{github.workspace}}\${{env.OUT_DIR}}\
        retention-days: 14

  release:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_OUTPUT

      - name: Delete previous rolling release (if exists)
        run: |
          if gh release view rolling &>/dev/null; then
            echo "Existing rolling release. Deleting it."
            gh release delete rolling -y
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling tag
        run: |
          git tag -f rolling
          git push origin rolling --force

      - name: Create rolling pre-release
        run: |
          NOTES=$(cat <<EOF
          Latest build from main branch.

          **Build Info:**
          - Commit: $GITHUB_SHA
          - Workflow: [View workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF
          )

          gh release create rolling \
            --title "Rolling Build (${{ steps.vars.outputs.sha_short }})" \
            --notes "$NOTES" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries
        run: |
          cd artifacts
          for dir in ./*/; do
            name=$(basename "$dir")
            echo "Zipping $name"
            zip -r "../${name}.zip" "$dir"
            gh release upload rolling "../${name}.zip" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
